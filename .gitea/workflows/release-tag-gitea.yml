name: release-tag
on:
  push:
    branches:
      - 'main'

jobs:
  release-image:
    runs-on: ubuntu-latest
    env:
      DOCKER_ORG: sendnrw
      DOCKER_LATEST: latest
      RUNNER_TOOL_CACHE: /toolcache
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v2
        with:
          config-inline: |
            [registry."git.send.nrw"]
              http = true
              insecure = true

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.send.nrw
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Meta
        id: meta
        run: |
          echo REPO_VERSION=$(git describe --tags --always | sed 's/^v//') >> $GITHUB_OUTPUT

      - name: Build and push NeuroForge
        uses: docker/build-push-action@v4
        with:
          context: ./platform/neuroforge
          file: ./platform/neuroforge/Dockerfile
          target: server
          platforms: |
            linux/amd64
          push: true
          tags: |
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-neuroforge:${{ steps.meta.outputs.REPO_VERSION }}
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-neuroforge:${{ env.DOCKER_LATEST }}

      - name: Build and push NeuroForge Worker
        uses: docker/build-push-action@v4
        with:
          context: ./platform/neuroforge
          file: ./platform/neuroforge/Dockerfile
          target: worker
          platforms: |
            linux/amd64
          push: true
          tags: |
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-neuroforge-worker:${{ steps.meta.outputs.REPO_VERSION }}
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-neuroforge-worker:${{ env.DOCKER_LATEST }}

      - name: Build and push Agent
        uses: docker/build-push-action@v4
        with:
          context: ./services/agent
          file: ./services/agent/Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-agent:${{ steps.meta.outputs.REPO_VERSION }}
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-agent:${{ env.DOCKER_LATEST }}

      - name: Build and push Agent Data Init
        uses: docker/build-push-action@v4
        with:
          context: ./services/agent
          file: ./services/agent/Dockerfile
          target: data-init
          platforms: |
            linux/amd64
          push: true
          tags: |
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-agent-data-init:${{ steps.meta.outputs.REPO_VERSION }}
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-agent-data-init:${{ env.DOCKER_LATEST }}

      - name: Build and push Knowledgebase
        uses: docker/build-push-action@v4
        with:
          context: ./services/knowledge
          file: ./services/knowledge/Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-knowledge:${{ steps.meta.outputs.REPO_VERSION }}
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-knowledge:${{ env.DOCKER_LATEST }}

      - name: Build and push Control Center
        uses: docker/build-push-action@v4
        with:
          context: ./services/control
          file: ./services/control/Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-control:${{ steps.meta.outputs.REPO_VERSION }}
            git.send.nrw/${{ env.DOCKER_ORG }}/glpi-neuroforge-mega-control:${{ env.DOCKER_LATEST }}
