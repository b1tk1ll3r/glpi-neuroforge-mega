      NEUROFORGE_FAIL_OPEN: ${NEUROFORGE_FAIL_OPEN:-true}
      NEUROFORGE_NAMESPACE: ${NEUROFORGE_NAMESPACE:-glpi-agent}
      NEUROFORGE_SEARCH_K: ${NEUROFORGE_SEARCH_K:-128}
      NEUROFORGE_TIMEOUT: ${NEUROFORGE_TIMEOUT:-}
