    volumes:
    - agent-data:/app/data
    - ${KB_DATA_PATH:-./knowledge}:/app/knowledge:ro
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - /app/glpi-ai-agent
      - healthcheck
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 10s
    stop_grace_period: 20s
  knowledge:
    image: git.send.nrw/sendnrw/glpi-neuroforge-mega-knowledge:${IMAGE_TAG:?Set IMAGE_TAG to an immutable release tag, for example 1.5.4}
    restart: unless-stopped
