# Private SearXNG instance for NeuroForge research.
# SEARXNG_SECRET and SEARXNG_BASE_URL override the corresponding server values.
use_default_settings: true

general:
  debug: false
  instance_name: "NeuroForge Research Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  default_http_headers:
    X-Robots-Tag: "noindex, nofollow"
    Referrer-Policy: "no-referrer"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
