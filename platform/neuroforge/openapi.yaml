openapi: 3.1.0
info:
  title: NeuroForge API
  version: 0.8.2
  description: REST API for NeuroForge associative learning, explainable vector recall,
    provenance, document/text ingestion, SearXNG-backed autonomous research, source-grounded
    goal cycles, responsive knowledge graph, model routing, cost controls, Prometheus
    observability, and durable storage/cluster operation.
servers:
- url: http://localhost:8080
components:
  securitySchemes:
    AppKey:
      type: http
      scheme: bearer
    WorkerKey:
      type: http
      scheme: bearer
    ControlReadKey:
      type: http
      scheme: bearer
      description: Scoped read token used by the Control Center for graph/orchestrator status.
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
    MetricsToken:
      type: http
      scheme: bearer
      description: Dedicated Prometheus scrape token. The admin token is also accepted
        as a bearer credential.
    ClusterToken:
      type: apiKey
      in: header
      name: X-Cluster-Token
  schemas:
    ModelRoute:
      type: object
      properties:
        provider:
          type: string
          enum:
          - ''
          - auto
          - ollama
          - openai
          description: Empty/omitted inherits the legacy role provider.
        model:
          type: string
        node_id:
          type: string
          description: Optional strict Ollama node pin.
    RoutingConfig:
      type: object
      properties:
        chat_provider:
          type: string
          enum:
          - auto
          - ollama
          - openai
        embedding_provider:
          type: string
          enum:
          - auto
          - ollama
          - openai
        chat_model:
          type: string
          description: Optional actor model override; empty uses the Ollama node default.
        embedding_model:
          type: string
          description: Optional embedding model override; empty uses the Ollama node
            default.
        chat_node_id:
          type: string
          description: Optional strict actor Ollama node pin.
        embedding_node_id:
          type: string
          description: Optional strict embedding Ollama node pin.
        critic:
          $ref: '#/components/schemas/ModelRoute'
        consolidator:
          $ref: '#/components/schemas/ModelRoute'
        goal:
          $ref: '#/components/schemas/ModelRoute'
    OllamaServer:
      type: object
      required:
      - id
      - base_url
      - weight
      - enabled
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
        chat_model:
          type: string
        embedding_model:
          type: string
        weight:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        request_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Per-node inference timeout in seconds. 0 disables the model-inference
            deadline.
        num_ctx:
          type: integer
          minimum: 0
          description: Ollama num_ctx runtime option. 0 uses the model/Ollama default.
        num_predict:
          type: integer
          minimum: 0
          description: Ollama num_predict runtime option. 0 inherits NeuroForge's
            caller/global output limit.
        think:
          type: string
          enum:
          - false
          - true
          - low
          - medium
          - high
          - max
          description: Ollama thinking mode.
        chat_keep_alive:
          type: string
          description: Ollama keep_alive for chat requests, e.g. 30m or 0.
        embedding_keep_alive:
          type: string
          description: Ollama keep_alive for embedding requests, e.g. 5m or 0.
    ModelRoutingLearning:
      type: object
      required:
      - auto_reward_enabled
      - auto_reward_mode
      - consolidation_enabled
      - consolidation_use_llm
      - autonomy_enabled
      - autonomy_use_llm
      properties:
        auto_reward_enabled:
          type: boolean
        auto_reward_mode:
          type: string
          enum:
          - vector
          - llm
        consolidation_enabled:
          type: boolean
        consolidation_use_llm:
          type: boolean
        autonomy_enabled:
          type: boolean
        autonomy_use_llm:
          type: boolean
    ModelRoutingSettings:
      type: object
      required:
      - routing
      - ollama
      - learning
      properties:
        routing:
          $ref: '#/components/schemas/RoutingConfig'
        ollama:
          type: array
          items:
            $ref: '#/components/schemas/OllamaServer'
        learning:
          $ref: '#/components/schemas/ModelRoutingLearning'
    ModelRoutingUpdate:
      type: object
      description: Partial update. Omitted sections are preserved.
      properties:
        routing:
          $ref: '#/components/schemas/RoutingConfig'
        ollama:
          type: array
          items:
            $ref: '#/components/schemas/OllamaServer'
        learning:
          $ref: '#/components/schemas/ModelRoutingLearning'
    Memory:
      type: object
      required:
      - id
      - kind
      - memory_type
      - text
      properties:
        id:
          type: string
        kind:
          type: string
        memory_type:
          type: string
          enum:
          - episodic
          - semantic
          - procedural
          - working
        text:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
        vector_dim:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: string
        session_id:
          type: string
        parent_id:
          type: string
        shard_id:
          type: string
        origin_shard_id:
          type: string
        home_shard_id:
          type: string
        salience:
          type: number
        confidence:
          type: number
        reward:
          type: number
          minimum: -1
          maximum: 1
        created_at:
          type: string
          format: date-time
        accessed_at:
          type: string
          format: date-time
        access_count:
          type: integer
          format: int64
        consolidated_from:
          type: array
          items:
            type: string
        consolidated_into:
          type: string
        consolidation_count:
          type: integer
        truth_key:
          type: string
        version:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - active
          - superseded
          - conflicted
          - archived
        conflict_group:
          type: string
        supersedes:
          type: array
          items:
            type: string
        compressed:
          type: boolean
        provenance:
          $ref: '#/components/schemas/MemoryProvenance'
        evidence_source_ids:
          type: array
          items:
            type: string
        evidence_count:
          type: integer
          minimum: 0
    SearchHit:
      type: object
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        similarity:
          type: number
        score:
          type: number
        base_score:
          type: number
        graph_boost:
          type: number
        type_weight:
          type: number
        salience_factor:
          type: number
        confidence_factor:
          type: number
        candidate_source:
          type: string
          enum:
          - hnsw
          - disk-pq
          - scan
          - synapse
    LearnRequest:
      type: object
      required:
      - text
      properties:
        text:
          type: string
        kind:
          type: string
        memory_type:
          type: string
          enum:
          - episodic
          - semantic
          - procedural
          - working
        session_id:
          type: string
        tags:
          type: array
          items:
            type: string
        salience:
          type: number
        confidence:
          type: number
        truth_key:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
    ChatRequest:
      type: object
      required:
      - input
      properties:
        session_id:
          type: string
        input:
          type: string
        provider:
          type: string
          enum:
          - auto
          - ollama
          - openai
        model:
          type: string
    VectorSearchRequest:
      type: object
      required:
      - vector
      properties:
        vector:
          type: array
          minItems: 1
          items:
            type: number
            format: float
        k:
          type: integer
          minimum: 1
        min_similarity:
          type: number
          minimum: -1
          maximum: 1
        graph_bonus:
          type: number
    FeedbackRequest:
      type: object
      required:
      - response_memory_id
      - source_memory_ids
      - rating
      properties:
        response_memory_id:
          type: string
        source_memory_ids:
          type: array
          items:
            type: string
        rating:
          type: number
          minimum: -1
          maximum: 1
    Goal:
      type: object
      required:
      - title
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          - failed
        priority:
          type: integer
          minimum: 1
          maximum: 100
        progress:
          type: number
          minimum: 0
          maximum: 1
        target:
          type: string
        prediction:
          type: string
        next_action:
          type: string
        last_evaluation:
          type: number
          minimum: -1
          maximum: 1
        progress_reason:
          type: string
        research_evidence:
          type: integer
          minimum: 0
        research_sources:
          type: integer
          minimum: 0
        research_corroborations:
          type: integer
          minimum: 0
        research_source_ids:
          type: array
          items:
            type: string
        staging_drafts_created:
          type: integer
          minimum: 0
        staging_drafts_updated:
          type: integer
          minimum: 0
        last_staging_draft_id:
          type: string
        last_staging_error:
          type: string
        staging_draft_validated:
          type: boolean
        staging_quality_gate_version:
          type: string
        last_staging_attempt_signature:
          type: string
        memory_ids:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_cycle_at:
          type: string
          format: date-time
        auto_run:
          type: boolean
        interval_minutes:
          type: integer
          minimum: 1
        next_cycle_at:
          type: string
          format: date-time
        research_enabled:
          type: boolean
        consecutive_errors:
          type: integer
          minimum: 0
        last_error:
          type: string
    LearningCycle:
      type: object
      properties:
        id:
          type: string
        goal_id:
          type: string
        observation:
          type: string
        prediction:
          type: string
        evaluation:
          type: number
          minimum: -1
          maximum: 1
        learning:
          type: string
        memory_id:
          type: string
        cost_usd:
          type: number
        created_at:
          type: string
          format: date-time
        research_run_id:
          type: string
          description: Persisted live/audit research run associated with this goal cycle.
        research_queries:
          type: array
          items:
            type: string
        sources_found:
          type: integer
        sources_ingested:
          type: integer
        research_errors:
          type: array
          items:
            type: string
    ClusterEntry:
      type: object
      required:
      - id
      - term
      - index
      - leader_id
      - type
      - payload
      properties:
        id:
          type: string
        term:
          type: integer
          format: int64
          minimum: 1
        index:
          type: integer
          format: int64
          minimum: 1
        leader_id:
          type: string
        type:
          type: string
          enum:
          - memory.upsert
        payload:
          description: JSON-encoded operation payload.
        created_at:
          type: string
          format: date-time
    ClusterDecision:
      type: object
      properties:
        entry_id:
          type: string
        term:
          type: integer
          format: int64
        index:
          type: integer
          format: int64
        decision:
          type: string
          enum:
          - commit
          - abort
        created_at:
          type: string
          format: date-time
    ClusterVoteRequest:
      type: object
      required:
      - term
      - candidate_id
      - last_log_index
      properties:
        term:
          type: integer
          format: int64
          minimum: 1
        candidate_id:
          type: string
        last_log_index:
          type: integer
          format: int64
          minimum: 0
    ClusterVoteResponse:
      type: object
      properties:
        term:
          type: integer
          format: int64
        vote_granted:
          type: boolean
        voter_id:
          type: string
    ClusterHeartbeat:
      type: object
      required:
      - term
      - leader_id
      properties:
        term:
          type: integer
          format: int64
          minimum: 1
        leader_id:
          type: string
        commit_index:
          type: integer
          format: int64
          minimum: 0
        last_index:
          type: integer
          format: int64
          minimum: 0
    ClusterHeartbeatResponse:
      type: object
      properties:
        term:
          type: integer
          format: int64
        accepted:
          type: boolean
        node_id:
          type: string
        last_index:
          type: integer
          format: int64
        commit_index:
          type: integer
          format: int64
    MemoryProvenance:
      type: object
      properties:
        source:
          type: string
        actor:
          type: string
        embedding_provider:
          type: string
        embedding_model:
          type: string
        embedding_node_id:
          type: string
        generation_provider:
          type: string
        generation_model:
          type: string
        generation_node_id:
          type: string
        goal_id:
          type: string
        source_memory_id:
          type: string
        note:
          type: string
        source_id:
          type: string
        source_uri:
          type: string
          format: uri
        source_title:
          type: string
        chunk_index:
          type: integer
          minimum: 0
        chunk_count:
          type: integer
          minimum: 0
        content_hash:
          type: string
        retrieved_at:
          type: string
          format: date-time
    LearningPolicy:
      type: object
      required:
      - enabled
      - learn_chat_inputs
      - learn_chat_responses
      - allow_explicit_learn
      - allow_imports
      - learn_goal_cycles
      - min_confidence
      - duplicate_similarity
      - semantic_min_confirmations
      - semantic_min_confidence
      - archive_negative_responses
      - negative_archive_threshold
      - max_memory_text_chars
      - source_trust
      properties:
        enabled:
          type: boolean
        learn_chat_inputs:
          type: boolean
        learn_chat_responses:
          type: boolean
        allow_explicit_learn:
          type: boolean
        allow_imports:
          type: boolean
        learn_goal_cycles:
          type: boolean
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
        duplicate_similarity:
          type: number
          minimum: -1
          maximum: 1
        semantic_min_confirmations:
          type: integer
          minimum: 2
          maximum: 100
        semantic_min_confidence:
          type: number
          minimum: 0
          maximum: 1
        archive_negative_responses:
          type: boolean
        negative_archive_threshold:
          type: number
          minimum: -1
          maximum: 0
        max_memory_text_chars:
          type: integer
          minimum: 256
        source_trust:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
    LearningPolicySettings:
      type: object
      required:
      - auto_learn
      - policy
      properties:
        auto_learn:
          type: boolean
        policy:
          $ref: '#/components/schemas/LearningPolicy'
    KnowledgeEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        memory_id:
          type: string
        related_ids:
          type: array
          items:
            type: string
        summary:
          type: string
        reason:
          type: string
        actor:
          type: string
        model:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    ResearchRunStats:
      type: object
      properties:
        queries: {type: integer}
        results: {type: integer}
        downloads_started: {type: integer}
        downloads_completed: {type: integer}
        pages: {type: integer}
        documents: {type: integer}
        claims: {type: integer, description: Transparent claim/evidence candidates extracted from source chunks.}
        new_evidence: {type: integer}
        duplicates: {type: integer}
        corroborations: {type: integer}
        rejected_sources: {type: integer}
        skipped_evidence: {type: integer}
        errors: {type: integer}
    ResearchEvent:
      type: object
      properties:
        seq: {type: integer, format: int64}
        id: {type: string}
        run_id: {type: string}
        goal_id: {type: string}
        type: {type: string}
        phase: {type: string}
        status: {type: string}
        query: {type: string}
        url: {type: string}
        title: {type: string}
        source_id: {type: string}
        memory_id: {type: string}
        message: {type: string}
        preview: {type: string}
        score: {type: number}
        similarity: {type: number}
        confidence: {type: number}
        metadata:
          type: object
          additionalProperties: {type: string}
        created_at: {type: string, format: date-time}
    ResearchRun:
      type: object
      properties:
        id: {type: string}
        goal_id: {type: string}
        goal_title: {type: string}
        status:
          type: string
          enum: [running, completed, completed_with_errors, failed, cancelled, interrupted]
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        queries:
          type: array
          items: {type: string}
        stats: {$ref: '#/components/schemas/ResearchRunStats'}
        last_seq: {type: integer, format: int64}
        last_error: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/ResearchEvent'}
    KnowledgeSource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        uri:
          type: string
        file_name:
          type: string
        mime:
          type: string
        sha256:
          type: string
        trust:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
        chunk_count:
          type: integer
        memory_ids:
          type: array
          items:
            type: string
        bytes:
          type: integer
          format: int64
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IngestTextRequest:
      type: object
      required:
      - text
      properties:
        title:
          type: string
        text:
          type: string
        source_uri:
          type: string
        tags:
          type: array
          items:
            type: string
        trust:
          type: number
          minimum: 0
          maximum: 1
        memory_type:
          type: string
          enum:
          - episodic
          - semantic
          - procedural
          - working
        source_type:
          type: string
    IngestResult:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/KnowledgeSource'
        memory_ids:
          type: array
          items:
            type: string
        chunks:
          type: integer
        duplicates:
          type: integer
        skipped:
          type: integer
        cost_usd:
          type: number
        warnings:
          type: array
          items:
            type: string
    ResearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        learn:
          type: boolean
        fetch_pages:
          type: boolean
        max_results:
          type: integer
          minimum: 1
        max_pages:
          type: integer
          minimum: 0
    ResearchResult:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            type: object
        sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
        ingested:
          type: integer
        documents_ingested:
          type: integer
          description: Number of fetched SearXNG file results routed through document ingestion.
        errors:
          type: array
          items:
            type: string
        cost_usd:
          type: number
paths:
  /metrics:
    get:
      summary: Prometheus metrics in the classic text exposition format
      security:
      - MetricsToken: []
      responses:
        '200':
          description: Prometheus text metrics
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        '401':
          description: Invalid metrics bearer token
  /healthz:
    get:
      summary: Compatibility alias for /livez
      responses:
        '200':
          description: Process is alive
  /api/v1/chat:
    post:
      security:
      - AppKey: []
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat answer with recalled memories and cost metadata
  /api/v1/learn:
    post:
      security:
      - AppKey: []
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnRequest'
      responses:
        '201':
          description: Stored memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
  /api/v1/search:
    post:
      security:
      - AppKey: []
      - AdminToken: []
      description: Embed once, search local HNSW plus configured remote shards, then
        merge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                k:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Ranked semantic hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
  /api/v1/search/vector:
    post:
      security:
      - AppKey: []
      - AdminToken: []
      description: Local-only vector search used by one-hop shard federation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchRequest'
      responses:
        '200':
          description: Local vector hits
  /api/v1/memory/import:
    post:
      security:
      - AppKey: []
      - AdminToken: []
      description: Idempotent import path for shard replication. This is separate
        from quorum cluster writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Memory'
      responses:
        '201':
          description: Imported memory
  /api/v1/feedback:
    post:
      security:
      - AppKey: []
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Reward and synapse changes applied
  /api/v1/stats:
    get:
      security:
      - AppKey: []
      - AdminToken: []
      responses:
        '200':
          description: Memory
          HNSW: null
          shard: null
          cluster: null
          maintenance and cost counters: null
  /api/v1/goals:
    get:
      security:
      - AppKey: []
      - AdminToken: []
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
    post:
      security:
      - AppKey: []
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Goal'
      responses:
        '201':
          description: Goal created
  /api/v1/goals/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      security:
      - AppKey: []
      - AdminToken: []
